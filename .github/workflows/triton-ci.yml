name: CCVNN Triton Microservice CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: read

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev pkg-config build-essential

      - name: Compile C++ Edge Engine Shared Library
        run: |
          mkdir -p build
          g++ -O3 -fPIC -shared scripts/cpp_glass_to_glass_profiler.cpp $(pkg-config --cflags --libs opencv4) -o build/libglass_profiler.so

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tritonclient[grpc]" numpy opencv-python-headless

      - name: Start Triton via Docker Compose
        run: |
          docker compose up -d triton-server

      - name: Wait for Triton gRPC & HTTP Readiness
        run: |
          echo "Waiting for Triton Server to become ready..."
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/v2/health/ready || true)
            if [ "$HTTP_STATUS" -eq 200 ] && (echo > /dev/tcp/127.0.0.1/8001) 2>/dev/null; then
              echo "Triton Server is READY on ports 8000 and 8001!"
              exit 0
            fi
            echo "Waiting for Triton ($i/30)... status: $HTTP_STATUS"
            sleep 3
          done

          echo "ERROR: Triton server failed to ready up. Dumping logs:"
          docker compose logs --tail=100
          exit 1

      - name: Run Synthetic Ingestion Test
        run: |
          python3 triton_stream_sim.py

      - name: Debug Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200