name: V25 Geometric Framework CI/CD

on:
  push:
    branches: [ main, feat/v25-geometric-framework ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch openvino numpy onnxscript onnx

      - name: Run V25 Export and Dynamic Verification Pipeline
        run: |
          python3 v25_export_pipeline.py

      - name: Archive Model Repository Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-repository-v25
          path: model_repository/
