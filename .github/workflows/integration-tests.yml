name: CCVNN - E2E Integration Tests

on:
  push:
    branches: [ "main", "master", "V14_Cumulative_Vector_Vision", "v*" ]
  pull_request:
    branches: [ "main", "master", "V14_Cumulative_Vector_Vision" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network & Diagnostic Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest "tritonclient[grpc]" paho-mqtt psycopg2-binary "pymodbus==3.7.4"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Docker Services
        run: docker compose up -d --build

      - name: Wait for Triton Server Readiness
        run: |
          echo "Waiting for Triton Server to become ready..."
          timeout 120s bash -c '
            until curl -s -f http://localhost:8000/v2/health/ready > /dev/null 2>&1; do
              echo "Waiting for Triton ready endpoint (http://localhost:8000/v2/health/ready)..."
              docker compose ps
              sleep 3
            done
          '
          echo "Triton Server is READY!"

      - name: Verify Service Health
        run: |
          docker compose ps

      - name: Run End-to-End Containerized Test Pipeline
        env:
          PLC_SLAVE_ID: "1"
        run: python3 scripts/test_e2e_containerized.py

      - name: Run Watcher Unit & Integration Tests
        run: |
          PYTHONPATH=. pytest watcher/tests/

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
      
      
      - name: Run Cyclotron Multi-Factor Unit Tests
        run: |
          python -m pytest watcher/tests/test_multi_factor.py -v

      - name: Run E2E Integration Suite
        env:
          MODBUS_HOST: "localhost"
          MODBUS_PORT: "5020"
        run: |
          python scripts/test_e2e_containerized.py
          