name: CCVNN - E2E Integration Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- ADD THIS STEP HERE ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest "tritonclient[grpc]"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------
      - name: Start Docker services & Wait for Health
        run: |
          docker compose up -d --build
          # Wait for Triton GRPC port 8001 to accept connections
          timeout 60s bash -c 'until nc -z localhost 8001; do sleep 2; done' || true

      - name: Run E2E Containerized Test
        run: |
          python scripts/test_e2e_containerized.py

      - name: Run Watcher Unit & Integration Tests
        run: |
          PYTHONPATH=. pytest watcher/tests/

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100