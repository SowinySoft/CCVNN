name: CCVNN - E2E Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Start Docker services
        run: |
          docker compose up -d --build
          sleep 10

      - name: Run E2E Containerized Test
        run: |
          python scripts/test_e2e_containerized.py

      - name: Run Watcher Unit & Integration Tests
        run: |
          pytest watcher/tests/

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100