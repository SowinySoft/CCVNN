name: CCVNN Triton Microservice CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tritonclient[grpc]" numpy

      # STEP 1: Start Triton via Docker Compose & Wait for Ports
      - name: Start Triton Service & Wait for Health
        run: |
          docker compose up -d triton || docker compose up -d
          echo "Waiting for Triton gRPC (8001) and HTTP (8000)..."
          timeout 60s bash -c 'until nc -z localhost 8001 && curl -s http://127.0.0.1:8000/v2/health/ready | grep -q ""; do sleep 2; done' || true

      # STEP 2: Run Synthetic Ingestion Test
      - name: Run Synthetic Ingestion Test
        run: |
          python3 triton_stream_sim.py

      # STEP 3: Debug Container Logs on Failure
      - name: Fetch Triton Container Logs on Failure
        if: failure()
        run: |
          echo "=== DOCKER CONTAINERS STATUS ==="
          docker compose ps
          echo "=== TRITON SERVER CONTAINER LOGS ==="
          docker compose logs --tail 200 triton || docker logs triton-server --tail 200 || true