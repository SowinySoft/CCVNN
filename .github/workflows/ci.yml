name: CCVNN CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Build, Test & Validate CCVNN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy "tritonclient[grpc]"

      - name: Validate Model Engine & Triton Config Files
        run: |
          test -f model_repository/ccvnn_inspector/config.pbtxt || (echo "Missing config.pbtxt" && exit 1)
          test -f model_repository/ccvnn_inspector/1/model.pt || (echo "Missing model.pt" && exit 1)
          echo "[✓] Model binary and Triton configuration exist."

      - name: Syntax Check Python Streaming Client
        run: |
          python -m py_compile scripts/triton_client_stream.py
          echo "[✓] Python streaming client syntax verified."

      - name: Setup LibTorch CPU & Build C++ Driver
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.2.0%2Bcpu.zip
          unzip -q libtorch-cxx11-abi-shared-with-deps-2.2.0+cpu.zip
          g++ -O3 scripts/cpp_inspection_engine.cpp \
              -I libtorch/include \
              -I libtorch/include/torch/csrc/api/include \
              -L libtorch/lib \
              -ltorch -ltorch_cpu -lc10 \
              -std=c++17 -o ccvnn_cpp_inspector
          echo "[✓] C++ LibTorch driver compiled successfully."

      - name: Execute C++ Standalone Sanity Run
        run: |
          export LD_LIBRARY_PATH=$PWD/libtorch/lib:$LD_LIBRARY_PATH
          ./ccvnn_cpp_inspector model_repository/ccvnn_inspector/1/model.pt
          echo "[✓] C++ engine execution validated."
