name: CCVNN Triton Microservice CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy tritonclient[grpc] pyyaml

    - name: Validate Kubernetes Manifests
      run: |
        python3 -c "import yaml; yaml.safe_load(open('k8s/deployment.yaml')); yaml.safe_load(open('k8s/service.yaml')); print('k8s Manifests Valid!')"

    - name: Build C++ DeepStream Probe Library
      run: |
        sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev
        g++ -shared -fPIC -O3 ccvnn_ds_probe.cpp -o libccvnn_ds_probe.so $(pkg-config --cflags --libs gstreamer-1.0)
        ls -lh libccvnn_ds_probe.so

    - name: Run Synthetic Ingestion Test
      run: |
        python3 triton_stream_sim.py
