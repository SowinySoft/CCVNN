name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build 1: Modbus PLC Simulator Image
      - name: Build and Push Modbus PLC
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ccvnn-modbus-plc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build 2: Watcher Edge Service Image
      - name: Build and Push Watcher Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ccvnn-watcher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max