apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccvnn-triton-deployment
  namespace: default
  labels:
    app: ccvnn-triton
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccvnn-triton
  template:
    metadata:
      labels:
        app: ccvnn-triton
    spec:
      containers:
      - name: triton-server
        image: nvcr.io/nvidia/tritonserver:26.08-py3
        command: ["tritonserver"]
        args:
          - "--model-repository=/models"
          - "--strict-model-config=false"
          - "--log-verbose=0"
        ports:
          - containerPort: 8000
            name: http
          - containerPort: 8001
            name: grpc
          - containerPort: 8002
            name: metrics
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: model-repo-volume
          mountPath: /models
      volumes:
      - name: model-repo-volume
        hostPath:
          path: /mnt/c/Users/Sowin/Downloads/DDVNN-HOME/CCVNN/model_repository
