# Networking & Listeners
listener 1883 0.0.0.0
allow_anonymous true

# Performance & In-Memory Queue Tuning
max_queued_messages 50000
max_inflight_messages 500
message_size_limit 1048576

# Persistence
persistence false

# Logging Setup
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information