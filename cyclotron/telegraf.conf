[agent]
  interval = "100ms"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ccvnn/edge/v17/+/v_cum"]
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "v_cum_telemetry"
    timestamp_path = "ts_us"
    timestamp_format = "unix_us"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.S_anomaly"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.S_cum"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.I_severity"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.C_debounce"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.R_plc"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.T_latency_us"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.H_health"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v_cum.Z_hash"
      type = "int"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "ccvnn-edge-telemetry-token"
  organization = "ccvnn"
  bucket = "v_cum_metrics"