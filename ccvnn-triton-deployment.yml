apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccvnn-triton-v20
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccvnn-triton-v20
  template:
    metadata:
      labels:
        app: ccvnn-triton-v20
    spec:
      containers:
      - name: triton
        image: ccvnn-triton-v20:local
        imagePullPolicy: Never
        command: ["python3", "app.py"]
        ports:
        - containerPort: 8000
