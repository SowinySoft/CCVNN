services:
  # 1. Edge PLC Simulator (v14/v17 Industrial Safety Actuation)
  plc-sim:
    #image: ghcr.io/sowinysoft/ccvnn-plc-sim:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.plc
    container_name: ccvnn-plc-sim
    restart: unless-stopped
    environment:
      - PLC_PORT=5020
      - PYTHONPATH=/app
    command:
      - python3
      - -m
      - watcher.simulators.modbus_server
      - --host
      - 0.0.0.0
      - --port
      - "5020"
    ports:
      - "5020:5020"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 5020), 2); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ccvnn-net

  # 2. MQTT Broker (v14/v17 Hazard Event Messaging)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: ccvnn-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t 'healthcheck' -m 'ping' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ccvnn-net

  # 3. Core Triton Inference Server (v12 Baseline + v17 Compatibility)
  triton-server:
    image: nvcr.io/nvidia/tritonserver:26.08-py3
    container_name: tritonserver_prod
    restart: unless-stopped
    ports:
      - "8000:8000"  # HTTP Inference API
      - "8001:8001"  # gRPC Inference API
      - "8002:8002"  # Metrics API
    volumes:
      - ./model_repository:/models:ro
    environment:
      - OMP_NUM_THREADS=1
      - OMP_WAIT_POLICY=PASSIVE
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=poll
      - --repository-poll-secs=10
      - --strict-model-config=false
      - --allow-grpc=true
      - --allow-http=true
      - --log-verbose=0
      - --exit-on-error=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    networks:
      - ccvnn-net

  # 4. TimescaleDB / PostgreSQL Telemetry & Buffer Backing Store
  ccvnn-db:
    image: timescale/timescaledb:latest-pg15
    container_name: ccvnn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccvnn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccvnn_db || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ccvnn_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ccvnn-net

  # 5. Watcher Governor & Edge Integration Service
  watcher-engine:
    #image: nvcr.io/nvidia/tritonserver:26.08-py3
    build:
      context: .
      dockerfile: docker/Dockerfile.watcher
    container_name: ccvnn-watcher-engine
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_healthy
      ccvnn-db:
        condition: service_healthy
      plc-sim:
        condition: service_healthy
      triton-server:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER=mqtt-broker
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - PLC_IP=plc-sim
      - PLC_HOST=plc-sim
      - PLC_PORT=5020
      - TRITON_HOST=triton-server
      - TRITON_PORT=8001
      - DB_HOST=ccvnn-db
      - DB_PORT=5432
      - DB_NAME=ccvnn_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_PATH=/app/data/watcher_buffer.db
      - CONFIG_PATH=config/watcher_stress_test_rules.yaml
      - PYTHONPATH=/app
    command: python watcher/daemon.py
    volumes:
      - ./config:/app/config
      - ccvnn-data:/app/data
    networks:
      - ccvnn-net

  # 6. Prometheus Telemetry Collector (v12 Baseline)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_triton
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
    depends_on:
      triton-server:
        condition: service_healthy
    networks:
      - ccvnn-net

  # 7. Grafana Observability Dashboard (v12 Baseline)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_triton
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - ccvnn-net

networks:
  ccvnn-net:
    driver: bridge

volumes:
  ccvnn_pgdata:
  ccvnn-data: