services:
  # 1. Mosquitto MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: ccvnn-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

# 2. Modbus TCP Simulator (PLC)
  modbus-plc:
    image: ghcr.io/sowinysoft/ccvnn/ccvnn-modbus-plc:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccvnn-plc-sim
    environment:
      - PYTHONPATH=/app
    # Execute script directly or via python module from /app working dir
    command: python3 watcher/simulators/modbus_server.py --host 0.0.0.0 --port 5020
    ports:
      - "5020:5020"
    restart: always

  # 4. CCVNN Safety Watcher Edge Service
  watcher-service:
    image: ghcr.io/sowinysoft/ccvnn/ccvnn-watcher:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccvnn-watcher
    depends_on:
      mqtt-broker:
        condition: service_healthy
      modbus-plc:
        condition: service_started
    environment:
      - MQTT_BROKER=ccvnn-mqtt
      - MQTT_PORT=1883
      - PLC_IP=ccvnn-plc-sim
      - PLC_PORT=5020
      - TRITON_HOST=ccvnn-triton
      - TRITON_PORT=8001
      - DB_PATH=/app/data/watcher_buffer.db
      - PYTHONPATH=/app
    volumes:
      - ccvnn-data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    
  # 3. Triton Inference Server (CPU/GPU model server)
  triton-server:
    image: nvcr.io/nvidia/tritonserver:26.08-py3
    container_name: ccvnn-triton
    command: tritonserver --model-repository=/models --allow-grpc=true --allow-http=true
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./model_repository:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  ccvnn-data: