apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccvnn-gateway
  labels:
    app: ccvnn-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccvnn-gateway
  template:
    metadata:
      labels:
        app: ccvnn-gateway
    spec:
      containers:
      - name: gateway
        image: ccvnn-triton-v20:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: TRITON_URL
          value: "localhost:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: ccvnn-gateway-service
spec:
  type: NodePort
  selector:
    app: ccvnn-gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
