replicaCount: 1

image:
  repository: nvcr.io/nvidia/tritonserver
  tag: 24.01-py3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8000
  grpcPort: 8001
  metricsPort: 8002

resources:
  limits:
    cpu: "4000m"
    memory: "8Gi"
    nvidia.com/gpu: "1"
  requests:
    cpu: "2000m"
    memory: "4Gi"
    nvidia.com/gpu: "1"

triton:
  modelRepository: "/models"
  logVerboseLevel: 0
  exitOnError: true
  dynamicBatching:
    maxQueueDelayMs: 2000
    maxBatchSize: 16

livenessProbe:
  httpGet:
    path: /v2/health/live
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /v2/health/ready
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 10
