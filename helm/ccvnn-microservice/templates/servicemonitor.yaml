apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ccvnn-microservice.name" . }}-monitor
  labels:
    {{- include "ccvnn-microservice.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ccvnn-microservice.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 5s
      path: /metrics
