apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccvnn-microservice.name" . }}
  labels:
    {{- include "ccvnn-microservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ccvnn-microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ccvnn-microservice.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: triton-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tritonserver"]
          args:
            - "--model-repository={{ .Values.triton.modelRepository }}"
            - "--log-verbose={{ .Values.triton.logVerboseLevel }}"
            - "--exit-on-error={{ .Values.triton.exitOnError }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
