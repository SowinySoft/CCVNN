apiVersion: v1
kind: Service
metadata:
  name: {{ include "ccvnn-microservice.name" . }}
  labels:
    {{- include "ccvnn-microservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ccvnn-microservice.selectorLabels" . | nindent 4 }}
