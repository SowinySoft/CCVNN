global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - '/etc/prometheus/v20_alerts.yml'

scrape_configs:
  - job_name: 'tritonserver'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          app: 'ccvnn_inference'
